<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5" />
  <meta name="theme-color" content="#08090d" />
  <meta name="color-scheme" content="dark" />
  <meta name="description" content="WeightFun — gamified calorie-deficit tracking. Turn your weight-loss goal into a points target." />

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="WeightFun" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%94%A5%3C/text%3E%3C/svg%3E" />

  <title>WeightFun</title>
  <link rel="stylesheet" href="./styles/app.css" />
</head>
<body>
  <div class="app-shell">
    <main id="view" class="view" role="main" aria-live="polite"></main>

    <nav class="tabbar" role="navigation" aria-label="Main">
      <button class="tab" data-route="home" type="button" aria-label="Home">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/><path d="M9.5 20v-5.5h5V20"/></svg>
        <span>Home</span>
      </button>
      <button class="tab" data-route="trends" type="button" aria-label="Trends">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/></svg>
        <span>Trends</span>
      </button>
      <button class="tab" data-route="integrations" type="button" aria-label="Integrations">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3v4"/><path d="M16 3v4"/><path d="M5 7h14v5a7 7 0 0 1-14 0z"/><path d="M12 19v2"/></svg>
        <span>Sync</span>
      </button>
      <button class="tab" data-route="profile" type="button" aria-label="Profile">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20.5a7.5 7.5 0 0 1 15 0"/></svg>
        <span>Profile</span>
      </button>
    </nav>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
