name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/weight-loss-gamification-app-qddhc7]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Requires Pages to be enabled once, under
      # Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
      # (enablement: true can't do it for us — the workflow token is allowed to
      # deploy to Pages but not to create the site.)
      - uses: actions/configure-pages@v5

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp index.html manifest.webmanifest _site/
          cp -r styles src _site/
          touch _site/.nojekyll
          # Also publish the single-file build, for anywhere that wants one file.
          npm run build:single -- _site/standalone.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
